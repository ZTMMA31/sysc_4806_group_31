<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head> <meta charset="UTF-8"> <title>Log in</title> </head>
<body>
<h1>4th Year Project Management System</h1>
<p th:if="${param.error}" style ="color:red">Invalid email or password.</p>
<p th:if="${param.logout}">You have been logged out.</p>

<form th:action="@{/login}" method="post">
    <label>Username <input type="email" name="username" required></label><br>
    <label>Password <input type="password" name="password" required></label><br>
    <button type="submit">Log in</button>
</form>
</body>
</html>
