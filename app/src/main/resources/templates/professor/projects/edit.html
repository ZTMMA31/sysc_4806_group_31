<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Project</title>
</head>
<body>
    <h1>
        Edit Project
    </h1>
    <form th:action="@{/professor/projects/{id}/edit(id=${project.id})}" method="post">
        <div>
            <label for="title">
                Title
            </label>
            <br>
            <input type="text"
                id="title"
                name="title"
                th:value="${project.title}"
                required>
        </div>
        <br>
        <div>
            <label for="description">
                Description
            </label>
            <br>
            <textarea id="description"
                    name="description"
                    th:text="${project.description}"
                    required>
            </textarea>
        </div>
        <br>
        <button type="submit">
            Save Changes
        </button>
    </form>
    <br>
    <a th:href="@{/professor/projects/{id}(id=${project.id})}">
        <button>
            Cancel
        </button>
    </a>
</body>
</html>
