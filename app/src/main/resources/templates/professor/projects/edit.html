<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Project</title>
</head>
<body>

<h1>Edit Project</h1>

<form th:action="@{/professor/projects/{id}/edit(id=${project.id})}"
      method="post">

    <div>
        <label for="title">Title:</label>
        <input type="text"
               id="title"
               name="title"
               th:value="${project.title}"
               required>
    </div>

    <div>
        <label for="description">Description:</label>
        <textarea id="description"
                  name="description"
                  th:text="${project.description}"
                  required></textarea>
    </div>

    <button type="submit">Save Changes</button>

</form>

<a th:href="@{/professor/projects/{id}(id=${project.id})}">
    Cancel
</a>

</body>
</html>
