<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Project</title>
</head>
<body>
    <h1>
        Create Project
    </h1>
    <form th:action="@{/professor/projects}" method="post">
        <div>
            <label for="title">
                Title
            </label>
            <br>
            <input type="text" id="title" name="title" required>
        </div>
        <br>
        <div>
            <label for="description">
                Description
            </label>
            <br>
            <textarea id="description"
                    name="description" required></textarea>
        </div>
        <br>
        <button type="submit">
            Create Project
        </button>
    </form>
    <br>
    <a th:href="@{/professor/projects}">
        <button>Cancel</button>
    </a>
</body>
</html>
