<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Details</title>
</head>
<body>
    <h1 th:text="${project.title}">
        Project Title
    </h1>
    <h2>
        Description
    </h2>
    <p th:text="${project.description}"></p>
    <h2>
        Professor
    </h2>
    <p th:text="${project.professor.username}"></p>
    <h2>
        Students
    </h2>
    <p th:if="${#lists.isEmpty(project.students)}">
        No students are currently enrolled in this project.
    <table th:if="${#lists.isEmpty(project.students)} == false">
        <tr>
            <th>
                Student ID
            </th>
            <th>
                Username
            </th>
            <th>
                Remove
            </th>
        </tr>
        <tr th:each="student : ${project.students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.username}"></td>
            <td>
                <form th:action="@{/professor/projects/{projectId}/students/{studentId}/remove(projectId=${project.id}, studentId=${student.id})}"
                    method="post"
                    onsubmit="return confirm('Remove this student from the project?');">
                    <button type="submit">
                        Remove
                    </button>
                </form>
            </td>
        </tr>
    </table>
    <h2>
        Actions
    </h2>
    <a th:href="@{/professor/projects/{id}/edit(id=${project.id})}">
        <button>
            Edit Project
        </button>
    </a>
    <br><br>
    <form th:action="@{/professor/projects/{id}/delete(id=${project.id})}"
        method="post"
        onsubmit="return confirm('Delete this project?');">
        <button type="submit">
            Delete Project
        </button>
    </form>
    <br>
    <a th:href="@{/professor/projects}">
        <button>
            Back to Projects
        </button>
    </a>
</body>
</html>
