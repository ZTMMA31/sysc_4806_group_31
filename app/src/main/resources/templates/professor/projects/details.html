<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Details</title>
</head>
<body>

<h1 th:text="${project.title}">Project Title</h1>

<h2>Description</h2>
<p th:text="${project.description}"></p>

<h2>Professor</h2>
<p th:text="${project.professor.username}"></p>

<a th:href="@{/professor/projects/{id}/edit(id=${project.id})}">
    Edit Project
</a>

<form th:action="@{/professor/projects/{id}/delete(id=${project.id})}"
      method="post"
      onsubmit="return confirm('Delete this project?');">

    <button type="submit">Delete Project</button>

</form>

<a th:href="@{/professor/projects}">Back to Projects</a>

</body>
</html>
